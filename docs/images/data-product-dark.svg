<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">The Pythia data product</title>
<desc id="d">Four steps from left to right: source, transformation, output port and consumer. All four rest on a RustFS storage layer with two folders. The source and the transformation use the internal folder. The transformation writes the output port into the external folder, and the consumer reads it, read-only.</desc>
